name: Generate snake contribution graph

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ff3df0&color_dots=#1b0f2e,#7c3aed,#a855f7,#d946ef,#ff3df0

      # The public streak-stats instance is often rate-limited and serves an
      # error card, so snapshot it here and keep the last good copy on failure.
      - name: Snapshot streak stats card
        run: |
          # snk runs in Docker and leaves dist/ owned by root
          sudo chown -R "$(id -u):$(id -g)" dist
          user=${{ github.repository_owner }}
          base="https://streak-stats.demolab.com/?user=$user"
          fallback="https://raw.githubusercontent.com/${{ github.repository }}/output/streak.svg"
          if curl -sSf -m 60 "$base&type=json" | tee /dev/stderr | grep -q '"totalContributions"' \
            && curl -sSf -m 60 "$base&theme=radical&hide_border=true" -o dist/streak.svg \
            && ! grep -qi 'failed to retrieve\|error' dist/streak.svg; then
            echo "Fetched fresh streak card"
          else
            echo "Streak API unavailable, keeping previous card"
            curl -sf -m 60 "$fallback" -o dist/streak.svg || rm -f dist/streak.svg
          fi

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
