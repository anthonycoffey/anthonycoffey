<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Anthony Coffey — Musician. Engineer. Artist. Maker.">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0a0214" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mandalaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>

    <!-- Flower of Life: r=30, full mandala extends to r=90 -->
    <g id="seed">
      <circle cx="0" cy="0" r="30"/>
      <circle cx="30" cy="0" r="30"/>
      <circle cx="15" cy="25.981" r="30"/>
      <circle cx="-15" cy="25.981" r="30"/>
      <circle cx="-30" cy="0" r="30"/>
      <circle cx="-15" cy="-25.981" r="30"/>
      <circle cx="15" cy="-25.981" r="30"/>
    </g>
    <g id="ring">
      <circle cx="45" cy="25.981" r="30"/>
      <circle cx="45" cy="-25.981" r="30"/>
      <circle cx="-45" cy="25.981" r="30"/>
      <circle cx="-45" cy="-25.981" r="30"/>
      <circle cx="60" cy="0" r="30"/>
      <circle cx="-60" cy="0" r="30"/>
      <circle cx="30" cy="51.962" r="30"/>
      <circle cx="-30" cy="51.962" r="30"/>
      <circle cx="30" cy="-51.962" r="30"/>
      <circle cx="-30" cy="-51.962" r="30"/>
      <circle cx="0" cy="51.962" r="30"/>
      <circle cx="0" cy="-51.962" r="30"/>
    </g>
    <g id="hexagram">
      <polygon points="0,-35 30.31,17.5 -30.31,17.5"/>
      <polygon points="0,35 30.31,-17.5 -30.31,-17.5"/>
    </g>
  </defs>

  <!-- Deep space -->
  <rect width="1280" height="360" fill="#000005"/>

  <!-- Distant nebula behind the mandala -->
  <ellipse cx="640" cy="180" rx="520" ry="160" fill="url(#nebula)"/>

  <!-- Static background stars -->
  <g fill="#ffffff">
    <circle cx="50"  cy="30"  r="0.7" opacity="0.55"/>
    <circle cx="130" cy="80"  r="0.5" opacity="0.4"/>
    <circle cx="210" cy="22"  r="0.9" opacity="0.6"/>
    <circle cx="290" cy="95"  r="0.6" opacity="0.5"/>
    <circle cx="380" cy="50"  r="0.8" opacity="0.55"/>
    <circle cx="460" cy="110" r="0.7" opacity="0.5"/>
    <circle cx="540" cy="25"  r="0.5" opacity="0.4"/>
    <circle cx="620" cy="75"  r="0.6" opacity="0.45"/>
    <circle cx="710" cy="30"  r="0.7" opacity="0.5"/>
    <circle cx="790" cy="100" r="0.6" opacity="0.45"/>
    <circle cx="870" cy="60"  r="0.8" opacity="0.55"/>
    <circle cx="950" cy="25"  r="1.0" opacity="0.65"/>
    <circle cx="1040" cy="90" r="0.6" opacity="0.45"/>
    <circle cx="1130" cy="50" r="0.7" opacity="0.5"/>
    <circle cx="1220" cy="95" r="0.5" opacity="0.4"/>
    <circle cx="90"  cy="130" r="0.5" opacity="0.4"/>
    <circle cx="180" cy="145" r="0.6" opacity="0.5"/>
    <circle cx="270" cy="65"  r="0.5" opacity="0.4"/>
    <circle cx="370" cy="130" r="0.8" opacity="0.55"/>
    <circle cx="1180" cy="30" r="0.6" opacity="0.5"/>
    <circle cx="40"  cy="230" r="0.6" opacity="0.5"/>
    <circle cx="110" cy="245" r="0.5" opacity="0.4"/>
    <circle cx="320" cy="250" r="0.5" opacity="0.4"/>
    <circle cx="410" cy="225" r="0.7" opacity="0.5"/>
    <circle cx="490" cy="240" r="0.6" opacity="0.45"/>
    <circle cx="900" cy="250" r="0.5" opacity="0.4"/>
    <circle cx="1000" cy="230" r="0.8" opacity="0.55"/>
    <circle cx="1090" cy="245" r="0.6" opacity="0.5"/>
    <circle cx="1180" cy="235" r="0.5" opacity="0.4"/>
    <circle cx="1240" cy="250" r="0.7" opacity="0.5"/>
    <circle cx="15"  cy="60"  r="0.5" opacity="0.4"/>
    <circle cx="25"  cy="200" r="0.6" opacity="0.5"/>
    <circle cx="10"  cy="320" r="0.4" opacity="0.3"/>
    <circle cx="1265" cy="70" r="0.6" opacity="0.5"/>
    <circle cx="1255" cy="180" r="0.5" opacity="0.4"/>
    <circle cx="1270" cy="290" r="0.7" opacity="0.5"/>
    <circle cx="60"  cy="160" r="0.4" opacity="0.35"/>
    <circle cx="1230" cy="160" r="0.5" opacity="0.4"/>
    <circle cx="155" cy="295" r="0.5" opacity="0.4"/>
    <circle cx="1100" cy="295" r="0.6" opacity="0.5"/>
    <circle cx="430" cy="305" r="0.4" opacity="0.3"/>
    <circle cx="850" cy="305" r="0.4" opacity="0.3"/>
    <circle cx="200" cy="338" r="0.5" opacity="0.4"/>
    <circle cx="1075" cy="338" r="0.5" opacity="0.4"/>
    <circle cx="640" cy="338" r="0.4" opacity="0.3"/>
  </g>

  <!-- Twinkling stars -->
  <g fill="#ffffff">
    <circle cx="80"  cy="60"  r="1.2" opacity="0.7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="45"  r="1.4" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.5s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="20"  r="1.0" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="6.2s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="55"  r="1.1" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.8s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="120" r="1.3" opacity="0.75">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.2s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="60"  r="1.0" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.4s" begin="-2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="125" r="1.2" opacity="0.75">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="220" r="1.1" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="5.6s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="245" r="1.3" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="225" r="0.9" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.8s" begin="-3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="240" r="1.1" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.2s" begin="-1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="220" r="1.2" opacity="0.75">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" begin="-2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="245" r="1.0" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6.4s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="100" r="2.0" opacity="0.95">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="-2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="70" r="1.8" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.5s" begin="-1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mandala glow halo -->
  <circle cx="640" cy="180" r="120" fill="url(#mandalaGlow)"/>

  <!-- Flower of Life mandala — counter-rotating layers, white -->
  <g transform="translate(640 180)" stroke="#ffffff" fill="none" filter="url(#soft)">
    <circle r="92" stroke-opacity="0.12" stroke-width="0.6"/>
    <circle r="100" stroke-opacity="0.06" stroke-width="0.5"/>

    <g stroke-opacity="0.55" stroke-width="0.9">
      <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="14s" repeatCount="indefinite"/>
      <g>
        <use href="#seed"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="60" dur="80s" repeatCount="indefinite"/>
      </g>
    </g>

    <g stroke-opacity="0.4" stroke-width="0.7">
      <animate attributeName="stroke-opacity" values="0.25;0.55;0.25" dur="18s" repeatCount="indefinite"/>
      <g>
        <use href="#ring"/>
        <animateTransform attributeName="transform" type="rotate" from="60" to="0" dur="120s" repeatCount="indefinite"/>
      </g>
    </g>

    <g stroke-opacity="0.4" stroke-width="0.5">
      <animate attributeName="stroke-opacity" values="0.2;0.55;0.2" dur="11s" repeatCount="indefinite"/>
      <use href="#hexagram"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="180s" repeatCount="indefinite"/>
    </g>

    <circle r="2.2" fill="#ffffff" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Particles orbiting the mandala -->
  <g transform="translate(640 180)">
    <g>
      <circle cx="105" cy="0" r="1" fill="#ffffff" opacity="0.7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="118" cy="0" r="0.8" fill="#ffffff" opacity="0.55"/>
      <animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="48s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="112" cy="0" r="0.9" fill="#ffffff" opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="220" to="580" dur="38s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="125" cy="0" r="0.7" fill="#ffffff" opacity="0.5"/>
      <animateTransform attributeName="transform" type="rotate" from="60" to="-300" dur="55s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="100" cy="0" r="0.6" fill="#ffffff" opacity="0.45"/>
      <animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="42s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="130" cy="0" r="0.6" fill="#ffffff" opacity="0.4"/>
      <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="60s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Name flanks the mandala -->
  <text x="510" y="205" text-anchor="end"
        font-family="'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="80" letter-spacing="3"
        fill="#ffffff">ANTHONY</text>

  <text x="770" y="205" text-anchor="start"
        font-family="'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="80" letter-spacing="3"
        fill="#ffffff">COFFEY</text>

  <!-- Subline -->
  <text x="640" y="290" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-weight="400" font-size="20" letter-spacing="10"
        fill="#cccccc" opacity="0.85">MUSICIAN  ·  ENGINEER  ·  ARTIST  ·  MAKER</text>

  <!-- Footer -->
  <text x="640" y="328" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-weight="400" font-size="12" letter-spacing="6"
        fill="#888888" opacity="0.7">AUSTIN, TX  //  COFFEY.CODES</text>
</svg>
