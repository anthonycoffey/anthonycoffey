<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Anthony Coffey — Musician. Engineer. Artist. Maker.">
  <defs>
    <linearGradient id="title" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ff3df0">
        <animate attributeName="stop-color" values="#ff3df0;#7c3aed;#22d3ee;#ff3df0" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#22d3ee;#ff3df0;#7c3aed" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#ff3df0;#7c3aed;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ff3df0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3df0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="55%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="#0a0612"/>

  <rect width="1280" height="360" fill="url(#orb1)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="360" fill="url(#orb2)">
    <animate attributeName="opacity" values="1;0.55;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="360" fill="url(#orb3)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="60" y1="70" x2="1220" y2="70"/>
    <line x1="60" y1="290" x2="1220" y2="290"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" fill="none" filter="url(#glow)">
    <circle cx="120" cy="180" r="34">
      <animate attributeName="r" values="34;42;34" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="180" r="22"/>
    <circle cx="1160" cy="180" r="34">
      <animate attributeName="r" values="34;42;34" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="180" r="22"/>
  </g>

  <text x="640" y="190" text-anchor="middle"
        font-family="'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="120" letter-spacing="6"
        fill="url(#title)">ANTHONY COFFEY</text>

  <text x="640" y="250" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-weight="400" font-size="22" letter-spacing="10"
        fill="#e5e5e5" opacity="0.85">MUSICIAN  ·  ENGINEER  ·  ARTIST  ·  MAKER</text>

  <text x="640" y="320" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-weight="400" font-size="14" letter-spacing="6"
        fill="#a78bfa" opacity="0.7">AUSTIN, TX  //  COFFEY.CODES</text>
</svg>
